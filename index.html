<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 수정 1: 제목 변경 -->
    <title>논리 회로 시뮬레이터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <!-- 수정 1, 2: 제목 변경 및 '10925 이지은B' 크기 축소 (CSS author 클래스) -->
        <h1>논리 회로 시뮬레이터 <span class="author">10925 이지은B</span></h1>
        
        <!-- 수정 12: 메뉴 버튼을 정사각형으로 변경 및 X버튼과 위치 겹침 -->
        <button id="menu-btn" class="menu-btn">☰</button>
    </header>

    <!-- 사이드 메뉴 -->
    <nav id="side-menu" class="hidden">
        <!-- 수정 12: 열렸을 때 ☰ 버튼과 겹치는 위치에 X 버튼 -->
        <button id="close-menu-btn" class="close-btn">X</button>
        <!-- 수정 3: 메뉴 이름 변경 ('회로도 그리기', '게이트 사전', '미션 챌린지') -->
        <button class="nav-btn" data-page="circuit">회로도 그리기</button>
        <button class="nav-btn" data-page="dictionary">게이트 사전</button>
        <button class="nav-btn" data-page="challenge">미션 챌린지</button>
    </nav>

    <!-- 1. 회로도 그리기 페이지 -->
    <main id="page-circuit" class="page active">
        <!-- 수정 13, 14: 레벨 챌린지에서 진입 시 띄울 상단 바 -->
        <div id="challenge-header" class="hidden">
            <!-- 수정 14: 이전 페이지(레벨 챌린지)로 돌아가는 화살표 -->
            <button id="back-to-challenge-btn">⬅</button>
            <!-- 수정 13: 레벨 제목 및 '진리표' 대신 '채점하기' 버튼 -->
            <h2 id="challenge-title">Level 1 : 기본 회로 설계하기</h2>
            <button id="submit-btn" class="submit-btn">채점하기</button>
        </div>

        <div class="toolbar" id="toolbar">
            <!-- 수정 4: INPUT/OUTPUT을 '변수'로 통합 -->
            <button class="tool-btn" data-type="variable">변수</button>
            <!-- 수정 7: 8가지 게이트 추가 -->
            <button class="tool-btn" data-type="and">AND</button>
            <button class="tool-btn" data-type="or">OR</button>
            <button class="tool-btn" data-type="not">NOT</button>
            <button class="tool-btn" data-type="nand">NAND</button>
            <button class="tool-btn" data-type="nor">NOR</button>
            <button class="tool-btn" data-type="xor">XOR</button>
            <button class="tool-btn" data-type="xnor">XNOR</button>
            <button class="tool-btn" data-type="buffer">Buffer</button>
            
            <!-- 수정 9: 휴지통 아이콘 -->
            <button id="trash-btn" class="tool-btn trash-btn">🗑️</button>
        </div>
        
        <div class="canvas-container" id="canvas-container">
            <svg id="circuit-svg"></svg>
        </div>
    </main>

    <!-- 2. 게이트 사전 페이지 -->
    <main id="page-dictionary" class="page hidden">
        <h2>게이트 사전</h2>
        <div class="gate-dict-grid" id="gate-dict-grid"></div>
        <!-- 수정 10: 사전 클릭 시 배경 어두워지는 오버레이 -->
        <div id="dict-overlay" class="hidden"></div>
    </main>

    <!-- 3. 미션 챌린지 페이지 -->
    <main id="page-challenge" class="page hidden">
        <h2>미션 챌린지</h2>
        <div class="level-grid">
            <!-- 수정 15: 성공/실패 상태 표시를 위한 클래스 -->
            <button class="level-btn unattempted" data-level="1">Level 1</button>
            <button class="level-btn unattempted" data-level="2">Level 2</button>
            <button class="level-btn unattempted" data-level="3">Level 3</button>
        </div>
    </main>

    <!-- 수정 9: 전체 삭제 확인 모달 -->
    <div id="delete-modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <p>회로도 전체를 삭제합니다</p>
            <div class="modal-buttons">
                <!-- 수정 9: 취소는 흰 배경, 삭제는 빨간 배경 -->
                <button id="cancel-delete" class="cancel-btn">취소</button>
                <button id="confirm-delete" class="delete-btn">삭제</button>
            </div>
        </div>
    </div>

    <!-- 수정 13: 채점 결과 모달 -->
    <div id="result-modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <h2 id="result-text">성공</h2>
            <button id="close-result-btn" class="cancel-btn">닫기</button>
        </div>
    </div>

    <!-- 스크립트 분리 로드 -->
    <script src="SimulatorEngine.js"></script>
    <script src="SimulatorUI.js"></script>
    <script src="app.js"></script>
</body>
</html>
