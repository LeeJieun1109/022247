<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털 논리회로 시뮬레이터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="dim-overlay" class="dim-overlay"></div>

    <!-- 우측 슬라이드 메뉴 -->
    <nav id="side-menu" class="side-menu">
        <button id="close-menu-btn" class="close-btn">&times;</button>
        <ul class="menu-list">
            <li><button class="nav-btn" data-target="main-page">홈으로</button></li>
            <li><button class="nav-btn" data-target="page-1">회로 시뮬레이터</button></li>
            <li><button class="nav-btn" data-target="page-2">게이트 사전</button></li>
            <li><button class="nav-btn" data-target="page-3">레벨 챌린지</button></li>
        </ul>
    </nav>

    <!-- 메인 화면 -->
    <section id="main-page" class="page active">
        <div class="content-box">
            <h1>디지털 논리회로 마스터</h1>
            <p class="subtitle">10925 이지은B</p>
            <div class="menu-buttons">
                <button class="nav-btn" data-target="page-1">회로 시뮬레이터</button>
                <button class="nav-btn" data-target="page-2">게이트 사전</button>
                <button class="nav-btn" data-target="page-3">레벨 챌린지</button>
            </div>
        </div>
    </section>

    <!-- 세부 페이지 1: 시뮬레이터 -->
    <section id="page-1" class="page">
        <header>
            <h2>회로도 설계</h2>
            <div class="header-controls">
                <button id="toggle-view-btn">진리표</button>
                <button class="open-menu-btn hamburger-btn">&#9776;</button>
            </div>
        </header>
        <div class="workspace">
            <aside class="gate-toolbar">
                <div class="gate-item" draggable="true" data-type="INPUT">
                    <span>INPUT</span><button class="info-btn" data-info="입력 신호 (X<sub>n</sub>)">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="AND">
                    <span>AND</span><button class="info-btn" data-info="모든 입력이 1일 때만 1 출력">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="OR">
                    <span>OR</span><button class="info-btn" data-info="입력 중 하나라도 1이면 1 출력">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="XOR">
                    <span>XOR</span><button class="info-btn" data-info="입력이 서로 다를 때만 1 출력">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="NOT">
                    <span>NOT</span><button class="info-btn" data-info="입력 반전">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="OUTPUT">
                    <span>OUTPUT</span><button class="info-btn" data-info="최종 출력 (Y<sub>n</sub>)">+</button>
                </div>
                
                <!-- 툴팁 박스 -->
                <div id="tooltip-box" class="tooltip-box hidden">
                    <button id="close-tooltip-btn" class="close-btn">&times;</button>
                    <p id="tooltip-desc"></p>
                </div>
            </aside>

            <!-- 줌 컨트롤 -->
            <div class="zoom-controls">
                <button id="zoom-in">+</button>
                <input type="range" id="zoom-slider" min="0.5" max="2" step="0.1" value="1">
                <button id="zoom-out">-</button>
            </div>

            <main class="canvas-area" id="circuit-canvas">
                <div id="canvas-inner">
                    <svg id="wire-layer"></svg>
                    <div id="gate-layer"></div>
                </div>
                
                <!-- 휴지통 아이콘 영역 -->
                <div id="trash-can" class="trash-can" title="객체를 끌어다 놓으면 삭제됩니다">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                    </svg>
                </div>

                <div id="table-view-container" class="hidden">
                    <table id="truth-table"></table>
                </div>
            </main>
        </div>
        
        <!-- 하단 수식 표시 영역 (캔버스와 겹치지 않게 워크스페이스 하단으로 배치) -->
        <div class="boolean-equation">
            <span id="equation-display">대기 중...</span>
        </div>
    </section>

    <!-- 세부 페이지 2: 게이트 사전 -->
    <section id="page-2" class="page">
        <header>
            <h2>논리 게이트 사전</h2>
            <button class="open-menu-btn hamburger-btn">&#9776;</button>
        </header>
        <div class="card-grid">
            <div class="gate-card">
                <h3>AND</h3>
                <div class="desc-box">AND: 곱연산. 직렬 스위치와 같습니다. 모든 입력이 참이어야 결과가 참이 됩니다.</div>
            </div>
            <div class="gate-card">
                <h3>OR</h3>
                <div class="desc-box">OR: 합연산. 병렬 스위치와 같습니다. 하나라도 참이면 결과가 참이 됩니다.</div>
            </div>
            <div class="gate-card">
                <h3>NOT</h3>
                <div class="desc-box">NOT: 반전. 입력이 1이면 0, 0이면 1로 뒤집습니다.</div>
            </div>
            <div class="gate-card">
                <h3>XOR</h3>
                <div class="desc-box">XOR: 배타적 논리합. 입력값이 서로 다를 때만 참을 출력합니다.</div>
            </div>
        </div>
    </section>

    <!-- 세부 페이지 3: 레벨 챌린지 -->
    <section id="page-3" class="page">
        <header>
            <h2>레벨 챌린지</h2>
            <button class="open-menu-btn hamburger-btn">&#9776;</button>
        </header>
        <div id="level-grid" class="card-grid"></div>
    </section>

    <script src="simulator-engine.js"></script>
    <script src="simulator-ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
