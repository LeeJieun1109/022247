<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>논리 회로 시뮬레이터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="dim-overlay" class="dim-overlay"></div>

    <nav id="side-menu" class="side-menu">
        <button id="close-menu-btn" class="close-btn">&times;</button>
        <ul class="menu-list">
            <li><button class="nav-btn" data-target="main-page">홈으로</button></li>
            <li><button class="nav-btn" data-target="page-1">회로도 그리기</button></li>
            <li><button class="nav-btn" data-target="page-2">게이트 사전</button></li>
            <li><button class="nav-btn" data-target="page-3">미션 챌린지</button></li>
        </ul>
    </nav>

    <section id="main-page" class="page active">
        <div class="content-box">
            <h1>논리 회로 시뮬레이터</h1>
            <p class="subtitle">10925 이지은B</p>
            <div class="menu-buttons">
                <button class="nav-btn" data-target="page-1">회로도 그리기</button>
                <button class="nav-btn" data-target="page-2">게이트 사전</button>
                <button class="nav-btn" data-target="page-3">미션 챌린지</button>
            </div>
        </div>
    </section>

    <section id="page-1" class="page">
        <header>
            <button id="back-to-challenge-btn" class="back-arrow-btn hidden">&lt;-</button>
            <h2 id="circuit-header-title">회로도 그리기</h2>
            <div class="header-controls">
                <button id="toggle-view-btn">진리표</button>
                <button id="submit-btn" class="submit-btn hidden">채점하기</button>
                <button class="open-menu-btn hamburger-btn">&#9776;</button>
            </div>
        </header>

        <div class="workspace">
            <aside class="gate-toolbar">
                <div class="gate-item" draggable="true" data-type="VARIABLE">
                    <span>변수</span><button class="info-btn" data-info="입출력 가능 변수 (좌측 선 연결시 출력, 미연결시 입력)">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="AND">
                    <span>AND</span><button class="info-btn" data-info="모든 입력이 1일 때만 1 출력">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="OR">
                    <span>OR</span><button class="info-btn" data-info="입력 중 하나라도 1이면 1 출력">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="NOT">
                    <span>NOT</span><button class="info-btn" data-info="입력 반전">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="NAND">
                    <span>NAND</span><button class="info-btn" data-info="AND 반전">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="NOR">
                    <span>NOR</span><button class="info-btn" data-info="OR 반전">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="XOR">
                    <span>XOR</span><button class="info-btn" data-info="입력이 서로 다를 때만 1 출력">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="XNOR">
                    <span>XNOR</span><button class="info-btn" data-info="입력이 서로 같을 때만 1 출력">+</button>
                </div>
                <div class="gate-item" draggable="true" data-type="Buffer">
                    <span>Buffer</span><button class="info-btn" data-info="신호 유지/전달">+</button>
                </div>
                
                <div id="tooltip-box" class="tooltip-box hidden">
                    <button id="close-tooltip-btn" class="close-btn">&times;</button>
                    <p id="tooltip-desc"></p>
                </div>
            </aside>

            <div class="zoom-controls">
                <button id="zoom-in">+</button>
                <input type="range" id="zoom-slider" min="0.5" max="2" step="0.1" value="1">
                <button id="zoom-out">-</button>
            </div>

            <main class="canvas-area" id="circuit-canvas">
                <div id="canvas-inner">
                    <svg id="wire-layer"></svg>
                    <div id="gate-layer"></div>
                </div>
                
                <div id="trash-can" class="trash-can" title="전체 삭제">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </div>

                <div id="table-view-container" class="hidden">
                    <table id="truth-table"></table>
                </div>
            </main>
        </div>
        
        <div class="boolean-equation">
            <span id="equation-display">대기 중...</span>
        </div>
    </section>

    <section id="page-2" class="page">
        <header>
            <h2>게이트 사전</h2>
            <button class="open-menu-btn hamburger-btn">&#9776;</button>
        </header>
        <div id="dict-dim-overlay" class="dict-dim-overlay"></div>
        <div id="dict-card-grid" class="card-grid"></div>
    </section>

    <section id="page-3" class="page">
        <header>
            <h2>미션 챌린지</h2>
            <button class="open-menu-btn hamburger-btn">&#9776;</button>
        </header>
        <div id="level-grid" class="card-grid"></div>
    </section>

    <div id="delete-modal-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <p>회로도 전체를 삭제합니다</p>
            <div class="modal-btn-group">
                <button id="cancel-delete-btn" class="btn-cancel">취소</button>
                <button id="confirm-delete-btn" class="btn-delete">삭제</button>
            </div>
        </div>
    </div>

    <div id="result-modal-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="result-modal-text">결과</h2>
            <button id="close-result-modal-btn" class="btn-cancel" style="margin-top:1.5rem;">닫기</button>
        </div>
    </div>

    <script src="SimulatorEngine.js"></script>
    <script src="SimulatorUI.js"></script>
    <script src="app.js"></script>
</body>
</html>
